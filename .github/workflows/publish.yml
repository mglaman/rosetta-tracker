name: Publish board

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - id: pages
        uses: actions/configure-pages@v6
      - name: Download the previous snapshot
        run: curl --fail --silent --location --output data.json "${{ steps.pages.outputs.base_url }}/data.json" || rm -f data.json
      - name: Refresh work items
        run: node scripts/refresh.mjs
        env:
          DRUPALCODE_TOKEN: ${{ secrets.DRUPALCODE_TOKEN }}
      - name: Assemble the site
        run: mkdir _site && cp index.html data.json _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
